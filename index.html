<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BeagleY Physio</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>BeagleY Physio</h1>
      <p class="subtitle">BLE Physiotherapy Measurement</p>

      <div class="status-row">
        <span id="statusDot" class="dot"></span>
        <span id="statusText">Disconnected</span>
      </div>

      <button id="connectBtn">Connect BeagleY-AI</button>

      <div class="grid">
        <div class="metric">
          <span>Standing Elbow</span>
          <strong id="standing">--.--°</strong>
        </div>
        <div class="metric">
          <span>Laying Elbow</span>
          <strong id="laying">--.--°</strong>
        </div>
        <div class="metric">
          <span>Forearm Tilt</span>
          <strong id="forearm">--.--°</strong>
        </div>
        <div class="metric highlight">
          <span>Final ROM</span>
          <strong id="rom">--.--°</strong>
        </div>
      </div>

      <button id="resetBtn" class="secondary" disabled>Reset ROM</button>
      <p id="message" class="message"></p>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
