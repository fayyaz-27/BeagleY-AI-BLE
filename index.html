<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hand Physiotherapy &middot; BLE Measurement System</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <header>
      <h1>Hand Physiotherapy</h1>
      <p class="subtitle">BLE Measurement System</p>
    </header>

    <section class="status-row">
      <span id="status-dot" class="status-dot disconnected" aria-hidden="true"></span>
      <span id="status-text" class="status-text">Bluetooth: Disconnected</span>
    </section>

    <section class="actions">
      <button id="connect-btn" class="btn btn-primary" type="button">Connect Bluetooth</button>
    </section>

    <div id="error-banner" class="error-banner" role="alert" hidden></div>

    <hr>

    <section class="measurements">
      <div class="metric">
        <span class="metric-label">Elbow ROM &mdash; Standing</span>
        <span id="elbow-standing" class="metric-value">--.--&deg;</span>
      </div>
      <div class="metric">
        <span class="metric-label">Elbow ROM &mdash; Laying</span>
        <span id="elbow-laying" class="metric-value">--.--&deg;</span>
      </div>
      <div class="metric">
        <span class="metric-label">Forearm Tilt</span>
        <span id="forearm-tilt" class="metric-value">--.--&deg;</span>
      </div>
      <div class="metric metric-final">
        <span class="metric-label">Final ROM</span>
        <span id="final-rom" class="metric-value">--.--&deg;</span>
      </div>
    </section>

    <hr>

    <section class="actions">
      <button id="reset-btn" class="btn btn-secondary" type="button">Reset ROM</button>
    </section>

    <footer>
      <p>Connects directly to a BeagleY-AI over Bluetooth Low Energy. No data leaves your device.</p>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
